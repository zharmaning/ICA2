<!DOCTYPE html>
<html>

<head>
    <title>JUMP Tractor Alexa App Dashboard</title>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <style>
        .statement {
            width: 300px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tractor Form</h1>

        <div id="banner" class="alert">&nbsp;</div>

        <form id="form">
            <div class="row mb-3">
                <div class="col-md-4">
                    <b>Tractor Name:</b>
                </div>
                <div class="col-md-8">
                    <input type="text" id="name" name='name' required/>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4"></div>
                <div id="name-error" class="col-md-8 text-danger">
                    &nbsp;
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <b>Clue:</b>
                </div>
                <div class="col-md-8">
                    <input type="text" id="clue" class="statement" name='clue' required/>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4"></div>
                <div id="clue-error" class="col-md-8 text-danger">
                    &nbsp;
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <b>Question:</b>
                </div>
                <div class="col-md-8">
                    <input type="text" id="question" class="statement" name='question' required/>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4"></div>
                <div id="question-error" class="col-md-8 text-danger">
                    &nbsp;
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <b>Correct Answer:</b>
                </div>
                <div class="col-md-8">
                    <select id="answer" name="answer">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4"></div>
                <div id="answer-error" class="col-md-8 text-danger">
                    &nbsp;
                </div>
            </div>

            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-8">
                    <button id="submit">Submit</button>
                </div>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const banner = document.getElementById('banner');

            let queryParameters = new URLSearchParams(window.location.search),
                tractorId = queryParameters.get('id')

            if (typeof tractorId !== 'undefined' && tractorId !== null) {
                fetch('/tractor/' + tractorId + '/', { method: 'GET' })
                    .then((response) => {
                        return new Promise((resolve) => response.json()
                            .then((json) => resolve({
                                status: response.status,
                                json,
                            })
                        ));
                    })
                    .then(({ status, json }) => {
                        if (200 === status) {
                            document.getElementById('name').value = json.data[0].name;
                            document.getElementById('clue').value = json.data[0].clue;
                            document.getElementById('question').value = json.data[0].question;
                            document.getElementById('answer').value = json.data[0].answer;
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                    });
            }

            document.getElementById('submit').addEventListener('click', (event) => {
                event.preventDefault() 
                let formData = new FormData(document.getElementById('form')),
                    action = queryParameters.get('action'),
                    endpoint = null,
                    fetchParams = { body: formData };
                if (action === 'insert') {
                    endpoint = '/tractor/';
                    fetchParams.method = 'POST' ;
                } else if (action === 'edit') {
                    endpoint = '/tractor/' + tractorId + '/';
                    fetchParams.method = 'PUT' ;
                }
                console.log(fetchParams);
                fetch(endpoint, fetchParams)
                    .then((response) => {
                        return new Promise((resolve) => response.json()
                            .then((json) => resolve({
                                status: response.status,
                                json,
                            })
                        ));
                    })
                    .then(({ status, json }) => {
                        const errorMessages = document.getElementsByClassName('text-danger');
                        banner.innerHTML = '&nbsp;';
                        banner.classList.remove('alert-success');
                        banner.classList.remove('alert-danger');
                        for (htmlElement of errorMessages) {
                            htmlElement.innerHTML = '&nbsp;';
                        }

                        if (200 === status) {
                            banner.innerHTML = 'Success!';
                            banner.classList.add('alert-success');
                        } else if (400 === status) {
                            banner.innerText = 'Form has errors. Please correct them and resubmit.';
                            banner.classList.add('alert-danger');
                            for (error of json.errors) {
                                const errorId = error.param + '-error';
                                document.getElementById(errorId).innerHTML = error.msg
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        return;
                    });

                    return;
            });
        });
    </script>
</body>

</html>
